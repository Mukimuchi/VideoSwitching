<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>高速カメラ切替デモ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="video-container">
        <video id="cam1" src="cam1.mp4" autoplay loop muted playsinline class="camera-video active"></video>
        <video id="cam2" src="cam2.mp4" autoplay loop muted playsinline class="camera-video"></video>
        <video id="cam3" src="cam3.mp4" autoplay loop muted playsinline class="camera-video"></video>
        <video id="cam4" src="cam4.mp4" autoplay loop muted playsinline class="camera-video"></video>
        <video id="cam5" src="cam5.mp4" autoplay loop muted playsinline class="camera-video"></video>
        <video id="cam6" src="cam6.mp4" autoplay loop muted playsinline class="camera-video"></video>
        <video id="cam7" src="cam7.mp4" autoplay loop muted playsinline class="camera-video"></video>
        <video id="cam8" src="cam8.mp4" autoplay loop muted playsinline class="camera-video"></video>
    </div>

    <div id = "playback-controls">
        <div class = "seek-bar-area">
            <input type = "range" id = "seekSlider" value = "0" min = "0" max = "100" step = "0.1">
        </div>
        <div class = "time-and-buttons">
            <button id = "playPauseButton">一時停止</button>
            <span id = "currentTime">0:00</span> / <span id = "duration">0.00</span>
        </div>
    </div>
    

    <div id="controls">
        <button onclick="switchCamera('cam1')">カメラ 1</button>
        <button onclick="switchCamera('cam2')">カメラ 2</button>
        <button onclick="switchCamera('cam3')">カメラ 3</button>
        <button onclick="switchCamera('cam4')">カメラ 4</button>
        <button onclick="switchCamera('cam5')">カメラ 5</button>
        <button onclick="switchCamera('cam6')">カメラ 6</button>
        <button onclick="switchCamera('cam7')">カメラ 7</button>
        <button onclick="switchCamera('cam8')">カメラ 8</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
